[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-music-platform"
version = "1.0.0"
description = "Production-oriented multi-guild Discord music bot"
requires-python = ">=3.13"
dependencies = [
  "discord.py[voice]>=2.6,<3",
  "PyNaCl>=1.5.0",
  "yt-dlp>=2025.8.0",
  "SQLAlchemy[asyncio]>=2.0.36,<3",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0,<2",
  "pydantic-settings>=2.7.0,<3",
  "redis[hiredis]>=5.2.0,<9",
  "psutil>=6.1.0,<8",
  "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
test = ["pytest>=8.3.0", "pytest-asyncio>=0.25.0"]

[tool.setuptools.packages.find]
include = ["bot*", "cogs*", "config*", "database*", "music*", "services*", "utils*", "views*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
